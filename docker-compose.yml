services:
  postgres:
    image: postgres:16
    container_name: supportmind_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: supportmind
      POSTGRES_PASSWORD: supportmind
      POSTGRES_DB: supportmind
    ports:
      - "5432:5432"
    volumes:
      - supportmind_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: supportmind_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - supportmind_redis_data:/data

volumes:
  supportmind_postgres_data:
  supportmind_redis_data: